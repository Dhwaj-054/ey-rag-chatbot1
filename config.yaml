# Settings for the document Q&A prototype.
#
# Every model name, path, size and threshold lives here. Nothing in src/ hard-codes
# one. Relative paths are resolved against the folder that holds this file.
#
# Values come from CLAUDE.md unless a comment says "starting value": those are
# defaults chosen while the code was written and are open to change.
#
# Settings marked SPEED trade time against something else. HANDOVER.md, section
# "Making it faster", says what each one costs.
#
# A setting that differs on one machine does not belong in this file. Put it in
# config.local.yaml next to it, in the same layout, with only the keys that differ:
#
#     paths:
#       docs_dir: "D:/somewhere/docs"
#
# That file is laid over this one when the settings are loaded. It is not in git, so
# it survives an update of the project.

paths:
  # The documents. Input, never modified. If they are kept somewhere else on this
  # machine, name that folder in config.local.yaml.
  docs_dir: docs
  # PDFs added through the chat screen ("Add documents") are kept here.
  uploads_dir: data/uploads
  data_dir: data                        # everything generated; git-ignored
  parsed_dir: data/parsed               # parsed documents as JSON (parse cache)
  figures_dir: data/figures             # cropped figure images
  sqlite_path: data/docqa.sqlite        # document register, description cache, query log
  # Optional. One row per document: file, doc_title, version, effective_date,
  # access_group. A document that is not listed gets its file name as its title.
  manifest: manifest.csv
  eval_questions: eval/questions.csv
  eval_results_dir: eval/results

llm:
  # An OpenAI-compatible endpoint. Ollama today. Moving to a vLLM server later means
  # changing base_url (and allow_remote) here, nothing else.
  base_url: http://localhost:11434/v1
  # Addresses that are not this machine are refused unless this is true. With true,
  # every question and the passages found for it are sent to base_url. HANDOVER.md,
  # section "Answers from a hosted endpoint", says what that means and how to set it up.
  allow_remote: false
  # Name of an environment variable that holds an API key. Ollama needs none. The key
  # itself never goes in this file.
  api_key_env: null
  # Where the vision model is served, if not at base_url. null: at base_url. Set it to
  # http://localhost:11434/v1 when base_url is a hosted endpoint, so that figure images
  # stay on this machine. vision_api_key_env is the key variable for that address.
  vision_base_url: null
  vision_api_key_env: null
  answer_model: qwen2.5:7b
  vision_model: qwen2.5vl:7b            # figures and flowcharts, ingestion only
  temperature: 0.0                      # starting value
  max_tokens: 400                       # SPEED: shorter replies reduce CPU generation time
  connect_timeout_s: 10                 # starting value
  request_timeout_s: 600                # starting value: CPU answers can take minutes
  # Not settable from here: the context window. Ollama defaults to 4,096 tokens and
  # its OpenAI-compatible endpoint cannot change that per request. Raise it in Ollama
  # (OLLAMA_CONTEXT_LENGTH=8192 or more) before asking real questions. See HANDOVER.md.

ui:
  # The chat screen: python -m docqa.web, then open http://127.0.0.1:8000
  host: 127.0.0.1                       # this machine only
  port: 8000                            # starting value
  # false: a host other than this machine is refused, so the screen cannot be opened
  # from the network by accident.
  allow_network: false
  # SPEED. true: the search models and the answer model are loaded when the screen
  # starts, in the background, so the first question does not wait for them. The
  # answer model is also given its instructions then, so that it does not have to
  # read them again with the first question.
  warm_up: true
  # The largest PDF that "Add documents" accepts, in megabytes. Starting value.
  max_upload_mb: 200

parsing:
  # Folder that holds Docling's own models (layout, tables, OCR). Fill it once with
  #   docling-tools models download layout tableformer rapidocr -o models/docling
  # The folder is git-ignored. null: Docling looks in its own cache, and tries to
  # download what is missing, which this project's offline setting stops.
  artifacts_path: models/docling
  # SPEED. Reading scanned pages (OCR): true = for every document, false = never,
  # auto = only for a document that has at least one page without a text layer.
  # A document that is all digital text is parsed faster without it.
  ocr: auto
  # With "auto": a page with this many characters of text or fewer counts as scanned.
  # Starting value.
  scanned_page_max_chars: 20
  ocr_languages: []                     # empty: the OCR engine's own default
  images_scale: 2.0                     # starting value: figure crops at 144 dpi (1.0 is 72 dpi)
  table_mode: accurate                  # SPEED. accurate or fast (Docling's TableFormer)
  # SPEED. CPU threads Docling may use. 0: one per physical core of this machine.
  num_threads: 0

figures:
  # SPEED. false: figures are still cropped and saved, but the vision model is not
  # called. Describing a figure is the slowest step of ingestion on a CPU.
  describe: true
  # Pictures without a caption are skipped if they look decorative: logos, stamps,
  # signatures, rules and banners. Three tests, all starting values. A picture that
  # has a caption is always kept.
  min_page_fraction: 0.02               # covers less of its page than this
  min_side_px: 60                       # its shorter side has fewer pixels than this
  max_aspect_ratio: 8.0                 # it is this many times longer than it is wide, or more
  # SPEED. A crop whose longer side has more pixels than this is scaled down before
  # the vision model sees it. Fewer pixels are read faster; too few and small labels
  # become unreadable. Starting value.
  max_side_px: 1280
  max_tokens: 700                       # SPEED. Longest figure description. Starting value

screening:
  # CLAUDE.md: a file that looks like it holds real customer data stops ingestion.
  enabled: true
  # A file with at least this many PAN-like or Aadhaar-like numbers is not ingested.
  # Starting value: a regulation may quote one or two as examples of the format.
  flag_at: 3

ingestion:
  # A run that would process more files than this stops and asks for --yes.
  # Parsing is slow on a CPU. Starting value.
  confirm_above_files: 25
  # SPEED. Files are taken through the three steps (parse, describe figures, index)
  # this many at a time, so that only one large model is in memory at once. After
  # each group its documents can be searched. Starting value.
  group_files: 20

embedding:
  model: BAAI/bge-m3                    # dense and sparse vectors; a local folder also works
  use_fp16: false                       # must stay false on CPU
  # SPEED. true: the model's weights are held as 8-bit numbers. Usually about twice as
  # fast on a CPU with about half the memory; the vectors differ slightly, so every
  # document is indexed again when this changes. NOT TRIED with the real model yet:
  # measure before and after (python -m docqa.stats). See src/docqa/quantize.py.
  quantize: false
  batch_size: 4                         # starting value: keep batches small on CPU
  # Longest input in tokens. The library's own default is 512, which would cut chunks
  # of up to 800 tokens without a warning. Starting value.
  max_length: 1024

reranker:
  model: BAAI/bge-reranker-v2-m3        # a local folder also works
  use_fp16: false                       # must stay false on CPU
  # SPEED. true: the reranker's weights are held as 8-bit numbers. On the laptop that
  # runs the models its test ranked 12 short passages in 1.5 s instead of 3.1 s, and
  # the answering passage still came first. Switched on with release 2026-11-23b to
  # bring an answer under two minutes. Scores shift slightly, so choose the threshold
  # again (python -m docqa.evaluate --suggest-threshold). How much it changes which
  # passages are found on real questions HAS NOT BEEN MEASURED. false: full precision.
  quantize: true
  # Passages scored in one go. They are sorted by length first, so that a batch holds
  # passages of similar length. Starting value.
  batch_size: 4
  max_length: 1024                      # starting value: question plus chunk, in tokens
  # true: scores are mapped to 0..1. retrieval.rerank_score_threshold is on this scale.
  normalize: true

qdrant:
  # Local mode: QdrantClient(path=...). For a Qdrant server later, set url and
  # set path to null. Exactly one of the two must be set.
  path: data/qdrant
  url: null
  collection: docqa_chunks              # starting value

chunking:
  min_tokens: 400
  max_tokens: 800
  overlap_min_tokens: 50
  overlap_max_tokens: 100

retrieval:
  # SPEED. Reranking is the slow part of a search: its time grows with this number.
  candidates: 15                        # taken from hybrid search, before reranking
  top_k: 4                              # kept after reranking
  rrf_k: 60                             # starting value: usual reciprocal rank fusion constant
  # SPEED. Ranking stops after this many seconds and goes on with the candidates it
  # has scored by then. Those that hybrid search placed highest are scored first, so
  # what is left out is what it placed lowest. The answer's tracker says when this
  # happened. null: every candidate is scored, however long it takes. Starting value.
  rerank_time_limit_s: 20
  # Below this best rerank score the chatbot replies with not_found_message and the
  # answer model is not called. CLAUDE.md gives no number: a sensible one depends on
  # the documents. 0.50 is a temporary starting value, set on the laptop that runs the
  # models for its first 15 documents. Choose it again with
  # "python -m docqa.evaluate --suggest-threshold" once eval/questions.csv has rows,
  # and again after switching reranker.quantize. null means not set: retrieval then
  # stops with a configuration error.
  rerank_score_threshold: 0.50
  default_access_group: all

generation:
  not_found_message: "I could not find this in the documents."
  # SPEED. Most evidence text, in characters, sent to the answer model with one
  # question. Evidence beyond it is cut and marked as cut. On a CPU the model needs
  # most of its time to read the evidence, so this is the main setting for answer
  # time. 12,000 characters is about three full passages. Starting value.
  evidence_char_budget: 8000
  # SPEED. A retrieved passage is given to the answer model only if its rerank score
  # is at least this share of the best passage's score. The best passage always is.
  # 0 gives the model every retrieved passage. Starting value.
  evidence_score_ratio: 0.5
  # SPEED. The longest an answer should take, in seconds, from the question to its
  # last word. null: no limit. With a limit, two things happen (src/docqa/generate/
  # budget.py):
  #   1. After the search, the evidence is cut to what the answer model can read in
  #      the time that is left, less writing_reserve_s. Its reading speed is measured
  #      on this machine from the answers already given (python -m docqa.stats).
  #   2. When the time is up the answer stops at the end of its last complete
  #      statement and says that it was stopped.
  # The reading itself is never interrupted. So the limit holds when the measured
  # speed holds; the first answers on a machine, before anything is measured, can
  # run over it. 120 was asked for on 2026-11-23.
  time_limit_s: 120
  # Of time_limit_s, the seconds kept for writing. An answer always gets at least
  # this long to be written, also when the reading took longer than planned.
  # Starting value: about 150 tokens at 4 to 5 tokens per second.
  writing_reserve_s: 35
  # The evidence is never cut below this many characters to fit the limit: less
  # than one passage is rarely enough to answer from. Starting value.
  min_evidence_chars: 1500
  # How fast the answer model reads, in characters of evidence per second, assumed
  # until this machine has answered a question. From then on the measured speed is
  # used. A cautious starting value for a 7B model on a laptop processor.
  read_chars_per_s: 45
